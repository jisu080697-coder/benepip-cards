# 포스트 대표 이미지 렌더링: 앱 스크립트가 요청 JSON을 보내면 실제 크롬으로 JPEG를 만들어 저장소에 올림
# 호출: POST https://api.github.com/repos/{owner}/{repo}/dispatches
#       { "event_type": "thumb", "client_payload": { "req": { id, ver, site, cat, head, date, photo?, broker?, topic? } } }
# 결과: thumbs/{id}/{ver}.jpg
name: render-thumb
on:
  repository_dispatch:
    types: [thumb]
permissions:
  contents: write
concurrency:
  group: thumb-${{ github.event.client_payload.req.id || github.run_id }}
  cancel-in-progress: false
jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 렌더러 준비
        run: npm ci
      - name: 요청 저장
        env:
          REQ: ${{ toJson(github.event.client_payload.req) }}
        run: printf '%s' "$REQ" > req.json
      - name: 대표 이미지 렌더링
        env:
          CI: 'true'
          PW_CHANNEL: chrome
        run: node thumbs/thumb.mjs req.json "thumbs/$(node -p "const r=require('./req.json');r.id+'/'+r.ver")".jpg
      - name: 이미지 올리기
        run: |
          git config user.name "benepip-renderer"
          git config user.email "renderer@users.noreply.github.com"
          git add thumbs
          git commit -m "thumb $(node -p "require('./req.json').id")" || echo "변경 없음"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
