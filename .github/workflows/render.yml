# 카드뉴스 렌더링: 앱 스크립트가 초안 JSON을 보내면 실제 크롬으로 PNG를 만들어 저장소에 올림
# 호출: POST https://api.github.com/repos/{owner}/{repo}/dispatches
#       { "event_type": "render", "client_payload": { "draft": { ...초안 JSON... } } }
name: render-cards
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-${{ github.event.client_payload.draft.id || github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 브라우저는 실행기에 이미 깔린 크롬을 씀 (다운로드·apt 설치가 느린 날 멈추지 않게) · 글꼴은 Pretendard 웹폰트
      - name: 렌더러 준비
        run: npm ci
      - name: 초안 저장
        if: github.event_name == 'repository_dispatch'
        env:
          DRAFT: ${{ toJson(github.event.client_payload.draft) }}
        run: printf '%s' "$DRAFT" > draft.json
      - name: 샘플 초안 (수동 실행 시)
        if: github.event_name == 'workflow_dispatch'
        run: cp samples/d1.json draft.json
      - name: 카드 렌더링
        env:
          CI: 'true'
          PW_CHANNEL: chrome
        run: node render.mjs draft.json "cards/$(node -p "const d=require('./draft.json');d.id+'/'+(d.ver||'v0')")"
      - name: 이미지 올리기
        run: |
          git config user.name "benepip-renderer"
          git config user.email "renderer@users.noreply.github.com"
          git add cards
          git commit -m "render $(node -p "require('./draft.json').id")" || echo "변경 없음"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 5)); done
