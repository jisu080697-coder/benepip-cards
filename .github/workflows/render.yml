# 카드뉴스 렌더링: 앱 스크립트가 초안 JSON을 보내면 실제 크롬으로 PNG를 만들어 저장소에 올림
# 호출: POST https://api.github.com/repos/{owner}/{repo}/dispatches
#       { "event_type": "render", "client_payload": { "draft": { ...초안 JSON... } } }
name: render-cards
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 한글 글꼴(대체용) 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 렌더러 준비
        run: npm ci || npm install && npx playwright-core install chromium
      - name: 초안 저장
        if: github.event_name == 'repository_dispatch'
        run: echo '${{ toJson(github.event.client_payload.draft) }}' > draft.json
      - name: 샘플 초안 (수동 실행 시)
        if: github.event_name == 'workflow_dispatch'
        run: cp samples/d1.json draft.json
      - name: 카드 렌더링
        env:
          CI: 'true'
        run: node render.mjs draft.json "cards/$(node -p "require('./draft.json').id")"
      - name: 이미지 올리기
        run: |
          git config user.name "benepip-renderer"
          git config user.email "renderer@users.noreply.github.com"
          git add cards
          git commit -m "render $(node -p "require('./draft.json').id")" || echo "변경 없음"
          git push
